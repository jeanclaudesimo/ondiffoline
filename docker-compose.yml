services:
  ondiffoline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ondiffoline
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORTAL_API_URL=https://portal.digitalssolutions.de
      - PORTAL_TENANT_KEY=8139c9c39b67bf5e159f55e081d8ad20cf56e5849f99c8e6ba05d3a0b2aa099a
      - GALLERY_SLUG=arbeit-im-bild
      - SECURITY_STATS_SECRET=ton-secret-securise-ici
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      # Middleware: Redirect HTTP to HTTPS
      - "traefik.http.middlewares.ondiffoline-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ondiffoline-https.redirectscheme.permanent=true"

      # Middleware: Redirect non-www to www
      - "traefik.http.middlewares.ondiffoline-www-redirect.redirectregex.regex=^https?://ondiffoline\\.de(.*)"
      - "traefik.http.middlewares.ondiffoline-www-redirect.redirectregex.replacement=https://www.ondiffoline.de$${1}"
      - "traefik.http.middlewares.ondiffoline-www-redirect.redirectregex.permanent=true"

      # HTTP ondiffoline.de → https://www.ondiffoline.de
      - "traefik.http.routers.ondiffoline-root-http.entrypoints=frontendsecure"
      - "traefik.http.routers.ondiffoline-root-http.rule=Host(`ondiffoline.de`)"
      - "traefik.http.routers.ondiffoline-root-http.middlewares=ondiffoline-www-redirect"

      # HTTP www.ondiffoline.de → https://www.ondiffoline.de
      - "traefik.http.routers.ondiffoline-http.entrypoints=frontendsecure"
      - "traefik.http.routers.ondiffoline-http.rule=Host(`www.ondiffoline.de`)"
      - "traefik.http.routers.ondiffoline-http.middlewares=ondiffoline-https"

      # HTTPS ondiffoline.de → https://www.ondiffoline.de
      - "traefik.http.routers.ondiffoline-root.entrypoints=frontendsecure"
      - "traefik.http.routers.ondiffoline-root.rule=Host(`ondiffoline.de`)"
      - "traefik.http.routers.ondiffoline-root.middlewares=ondiffoline-www-redirect"
      - "traefik.http.routers.ondiffoline-root.tls=true"
      - "traefik.http.routers.ondiffoline-root.tls.certresolver=leresolver"

      # HTTPS www.ondiffoline.de (main - no redirect)
      - "traefik.http.routers.ondiffoline.entrypoints=frontendsecure"
      - "traefik.http.routers.ondiffoline.rule=Host(`www.ondiffoline.de`)"
      - "traefik.http.routers.ondiffoline.tls=true"
      - "traefik.http.routers.ondiffoline.tls.certresolver=leresolver"
networks:
  traefik-net:
    external: true
